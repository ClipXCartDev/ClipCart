services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipcart}
      POSTGRES_DB: ${POSTGRES_DB:-clipcart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipcart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipcart}:${POSTGRES_PASSWORD:-clipcart}@db:5432/${POSTGRES_DB:-clipcart}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - clip_storage:/app/storage   # persist uploaded/base clips (local storage mode)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv:ro           # serve static SPAs (/, /admin/, /web/)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  clip_storage:
  caddy_data:
  caddy_config:
