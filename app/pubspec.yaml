name: clipcart
description: ClipCart — funny movie clip marketplace (mobile app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  # --- Editor stack ---
  video_player: ^2.9.2          # preview playback + time-synced subtitle overlay
  file_picker: ^8.1.4           # custom font (.ttf/.otf) + base clip picking
  path_provider: ^2.1.5         # app dirs for fonts/exports
  ffmpeg_kit_flutter_new: ^4.6.2 # on-device MP4 export (drawtext/overlay) — fixes Windows build
  gal: ^2.3.0                    # save exported MP4 to the phone Gallery
  share_plus: ^10.1.4            # share exported MP4 to Instagram/etc from the Exports tab
  flutter_staggered_grid_view: ^0.7.0 # dense masonry gallery (RenderForest-style)
  cached_network_image: ^3.4.1  # cache + downscale thumbnails (perf)
  shimmer: ^3.0.0               # skeleton loaders (premium loading feel)
  qr_flutter: ^4.1.0            # render Binance Pay checkout QR on the crypto pay screen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/   # place a default Roboto.ttf here (see app/README.md)
    - assets/icon/
