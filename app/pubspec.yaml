name: clipcart
description: ClipCart — funny movie clip marketplace (mobile app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  # --- Editor stack ---
  video_player: ^2.9.2          # preview playback + time-synced subtitle overlay
  file_picker: ^8.1.4           # custom font (.ttf/.otf) + base clip picking
  path_provider: ^2.1.5         # app dirs for fonts/exports
  ffmpeg_kit_flutter_new: ^1.6.1 # on-device MP4 export (drawtext/overlay) — community fork
  pro_video_editor: ^2.11.2     # richer visual editor engine (layers/trim/transitions)

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/   # place a default Roboto.ttf here (see app/README.md)
