<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipCart — Funny movie clips</title>
<style>
:root{--accent:#ff4d6d;--accent2:#ff8a3d;--ink:#e01a48;--bg:#f7f6f8;--surface:#fff;--border:#ece9f0;--text:#17131f;--muted:#726c7d;--ok:#12b76a;--gold:#f5a623;--grad:linear-gradient(135deg,#ff8a3d,#ff4d6d);--maxw:2100px;--pad:clamp(18px,4vw,72px);--shadow:0 8px 30px rgba(30,18,45,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:800;font-size:14px;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,77,109,.32);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(255,77,109,.4)}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.sec:hover{border-color:#d9d5e0}
.btn.sm{padding:8px 15px;font-size:13px}
input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:inherit;margin-bottom:10px;background:var(--surface);outline:none}
input:focus{border-color:var(--accent)}
/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.72);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;padding:13px var(--pad)}
nav .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px}
nav .logo .lg{width:31px;height:31px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900}
nav .links{display:flex;gap:20px;font-weight:700;font-size:14px;color:var(--muted)}
nav .links a:hover{color:var(--text)}
nav .sp{flex:1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:24px var(--pad) 80px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;margin:22px 0 8px;padding:56px 44px;background:radial-gradient(1200px 500px at 80% -10%,rgba(255,138,61,.28),transparent),radial-gradient(900px 500px at 0% 120%,rgba(255,77,109,.24),transparent),#120e1a;color:#fff;display:flex;align-items:center;gap:24px}
.hero-copy{flex:1;min-width:0;position:relative;z-index:2}
.hero .k{color:#ffb199;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.hero h1{font-size:clamp(34px,4.4vw,56px);font-weight:900;letter-spacing:-.035em;line-height:1.02;margin:14px 0 0;max-width:16ch}
.hero p{color:#cfc9d8;font-size:clamp(15px,1.4vw,18px);max-width:52ch;margin:18px 0 26px;line-height:1.5}
.center{display:flex;gap:12px;flex-wrap:wrap}
.hstat{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.hstat b{font-size:24px;font-weight:900;display:block}.hstat span{color:#a99fb6;font-size:12px;font-weight:600}
/* hero visual — floating clip collage */
.hero-visual{flex:0 0 40%;position:relative;height:430px}
.hcard{position:absolute;top:50%;left:50%;width:184px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);border:4px solid rgba(255,255,255,.10);background:#241e28}
.hcard video,.hcard img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .tag{position:absolute;left:9px;top:9px;font-size:9px;font-weight:900;padding:3px 7px;border-radius:6px;background:#12b76a;color:#fff}
.hcard.c0{transform:translate(-50%,-50%) scale(1.06);z-index:3}
.hcard.c1{transform:translate(-118%,-46%) rotate(-9deg) scale(.9);z-index:1;opacity:.9}
.hcard.c2{transform:translate(18%,-54%) rotate(9deg) scale(.9);z-index:1;opacity:.9}
/* how it works */
.hiw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:14px 0}
.hiw .step{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(30,20,40,.03)}
.hiw .n{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;margin-bottom:14px}
.hiw h3{margin:0 0 6px;font-size:17px;font-weight:800}.hiw p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
@media(max-width:860px){.hero{flex-direction:column;align-items:flex-start}.hero-visual{display:none}}
h2.sec{font-size:clamp(20px,2.4vw,28px);font-weight:900;letter-spacing:-.02em;margin:38px 0 4px}
.subsec{color:var(--muted);font-size:14px;margin:0 0 16px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.tpl{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(30,20,40,.04);transition:transform .16s,box-shadow .16s}
.tpl:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tpl .thumb{aspect-ratio:3/4;position:relative;display:flex;align-items:flex-end;padding:10px;background-size:cover;background-position:center}
.tpl .pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;z-index:1;background:#000}
.tpl .thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35));opacity:0;transition:.16s}
.tpl:hover .thumb:after{opacity:1}
.tpl .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.16s;z-index:3}
.tpl:hover .play{opacity:1}
.tpl .play span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tpl .play svg{width:22px;height:22px;fill:#17131f;margin-left:3px}
.tpl .badge{position:absolute;top:10px;left:10px;font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:6px;text-transform:uppercase;z-index:2}
.b-pro{background:var(--gold);color:#3a2600}.b-free{background:var(--ok);color:#fff}
.tpl .dur{color:#fff;font-size:10px;font-weight:800;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px;position:relative;z-index:2}
.tpl .m{padding:11px 13px}.tpl .nm{font-weight:800;font-size:13.5px;letter-spacing:-.01em}.tpl .by{color:var(--muted);font-size:11.5px;margin-top:2px}
/* chips */
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:9px 17px;font-size:13px;font-weight:700;color:var(--muted);transition:.12s}
.chip:hover{border-color:#d9d5e0}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(255,77,109,.3)}
.fbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.fbar input{max-width:440px;margin:0;flex:1}
.fbtn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.fbtn:hover{border-color:#d9d5e0}.fbtn.on{border-color:var(--accent);color:var(--accent)}
.fbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.fpanel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin:0 0 18px;box-shadow:var(--shadow)}
.fpanel .lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:4px 0 9px}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(30,20,40,.03)}
.plan{border:1px solid var(--border);border-radius:18px;padding:22px;background:var(--surface);box-shadow:0 1px 2px rgba(30,20,40,.03)}
.plan.hot{border-color:transparent;box-shadow:0 0 0 2px var(--accent),var(--shadow);transform:scale(1.02)}
.plan .p{font-size:30px;font-weight:900;margin:6px 0}.plan ul{list-style:none;padding:0;margin:14px 0;color:var(--muted);font-size:13.5px}
.plan li{padding:5px 0}.plan li:before{content:"✓";color:var(--ok);font-weight:900;margin-right:7px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.p-ok{background:#e7f7ef;color:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--border);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.qr{width:150px;height:150px;margin:10px 0;background:repeating-conic-gradient(#191521 0% 25%,#fff 0% 50%) 50%/16px 16px;border:6px solid #fff}
.err{color:var(--accent);font-size:13px}.muted{color:var(--muted)}
.center-box{max-width:380px;margin:48px auto}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs .chip{cursor:pointer}
footer{border-top:1px solid var(--border);color:var(--muted);font-size:13px;padding:30px var(--pad);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer .sp{flex:1}
@media(max-width:640px){.hero{padding:44px 24px;border-radius:22px}.wrap{padding:18px 16px 70px}nav .links{display:none}}
</style>
</head>
<body>
<nav>
  <a class="logo" onclick="go('home')"><span class="lg">C</span>ClipCart</a>
  <div class="links">
    <a onclick="go('browse')">Browse</a>
    <a onclick="go('pricing')">Pricing</a>
  </div>
  <div class="sp"></div>
  <div id="navauth"></div>
</nav>
<div class="wrap" id="view">Loading…</div>
<footer>
  <span class="logo" style="display:flex;align-items:center;gap:8px;font-weight:900"><span style="width:24px;height:24px;border-radius:7px;background:var(--grad);display:grid;place-items:center;color:#fff">C</span>ClipCart</span>
  <span class="sp"></span>
  <a onclick="go('browse')">Browse</a><a onclick="go('pricing')">Pricing</a><span>© ClipCart</span>
</footer>

<script>
let API=(new URLSearchParams(location.search).get('api')||localStorage.getItem('cc_api')||(location.protocol.indexOf('http')===0?location.origin+'/api/v1':'http://localhost:8000/api/v1')).replace(/\/$/,'');
localStorage.setItem('cc_api',API);
let TOKEN=localStorage.getItem('cc_web')||'';
let ME=null;

function h(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const GRAD=[['#ff7a59','#ff4d8d'],['#12c7a0','#3b9eff'],['#ff9247','#ff2d6b'],['#f5a623','#ff4d6d'],['#7b61ff','#4c9aff'],['#1a2740','#c0304a']];
function g(id){let n=0;for(const c of id)n=(n+c.charCodeAt(0))%GRAD.length;return GRAD[n];}
async function api(path,method='GET',body){
  const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){let d;try{d=await r.json()}catch(e){}throw new Error((d&&(d.detail?.message||d.detail))||('HTTP '+r.status));}
  return r.status===204?null:r.json();
}
const view=html=>document.getElementById('view').innerHTML=html;

async function boot(){
  if(TOKEN){try{ME=await api('/auth/me');}catch(e){TOKEN='';localStorage.removeItem('cc_web');}}
  renderNav(); go(location.hash.slice(2)||'home');
}
function renderNav(){
  document.getElementById('navauth').innerHTML = ME
    ? `<a onclick="go('account')" style="font-weight:700">${h(ME.name)}</a> &nbsp; <button class="btn sm sec" onclick="logout()">Log out</button>`
    : `<button class="btn sm sec" onclick="go('login')">Log in</button> <button class="btn sm" onclick="go('register')">Subscribe</button>`;
}
function logout(){TOKEN='';ME=null;localStorage.removeItem('cc_web');renderNav();go('home');}
function go(v){location.hash='#/'+v;({home:vHome,browse:vBrowse,pricing:vPricing,login:vLogin,register:vRegister,account:vAccount}[v]||vHome)();}

function clipCard(c){const[a,b]=g(c.id);return `<div class="tpl" onclick="clipDetail('${c.slug}')">
  <div class="thumb" onmouseenter="playPrev(this)" onmouseleave="stopPrev(this)" data-prev="${c.preview||''}" style="background:${c.thumb?`url('${c.thumb}')`:`linear-gradient(150deg,${a},${b})`};background-size:cover;background-position:center">
    ${c.preview?`<video class="pv" muted loop playsinline preload="none"></video>`:''}
    <span class="badge ${c.access==='pro'?'b-pro':'b-free'}">${c.access}</span>
    <span class="dur">${dur(c.duration_sec)}</span>
    <div class="play"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></div></div>
  <div class="m"><div class="nm">${h(c.title)}</div><div class="by">${h(c.category||c.genre||c.language)}${c.downloads>0?' · '+c.downloads+(c.downloads==1?' use':' uses'):''}</div></div></div>`;}
function playPrev(el){const url=el.dataset.prev;if(!url)return;const v=el.querySelector('.pv');if(!v)return;if(!v.src)v.src=url;v.style.opacity=1;v.play().catch(()=>{});}
function stopPrev(el){const v=el.querySelector('.pv');if(v){v.pause();v.style.opacity=0;}}
function dur(s){s=s||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

async function vHome(){
  view(`<div class="hero">
      <div class="hero-copy">
        <div class="k">Funny movie clips · ready to post</div>
        <h1>Turn viral clips into your brand</h1>
        <p>Browse trending meme &amp; movie clips, drop in your text, logo &amp; subtitles, and export a crisp MP4 on your phone — in seconds.</p>
        <div class="center"><button class="btn" onclick="go('register')">Start free →</button><button class="btn sec" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)" onclick="go('pricing')">See pricing</button></div>
        <div class="hstat"><div><b>90+</b><span>Ready templates</span></div><div><b>1080p</b><span>On-device export</span></div><div><b>Crypto</b><span>Binance Pay</span></div></div>
      </div>
      <div class="hero-visual" id="hv"></div>
    </div>
    <h2 class="sec">⚡ How it works</h2><p class="subsec">From clip to post in three taps — all on your phone</p>
    <div class="hiw">
      <div class="step"><div class="n">1</div><h3>Browse</h3><p>Pick from 90+ trending meme &amp; movie clips, refreshed every week.</p></div>
      <div class="step"><div class="n">2</div><h3>Customize</h3><p>Drop in your text, logo, subtitles &amp; styles — with a full CapCut-style editor.</p></div>
      <div class="step"><div class="n">3</div><h3>Export &amp; post</h3><p>Render a crisp MP4 on-device and share it to Reels, Shorts &amp; TikTok.</p></div>
    </div>
    <h2 class="sec">🔥 Trending this week</h2><p class="subsec">The clips everyone's remixing right now</p>
    <div class="grid" id="tr">Loading…</div>
    <div style="text-align:center;margin-top:26px"><button class="btn sec" onclick="go('browse')">Browse all clips →</button></div>`);
  try{
    const r=await api('/clips?sort=trending&limit=10');const items=r.items||[];
    document.getElementById('tr').innerHTML=items.map(clipCard).join('')||'<p class="muted">No clips yet.</p>';
    const hv=document.getElementById('hv');const pick=items.filter(c=>c.thumb).slice(0,3);
    if(hv&&pick.length)hv.innerHTML=pick.map((c,i)=>`<div class="hcard c${i}">${i===0&&c.preview?`<video src="${c.preview}" autoplay muted loop playsinline></video>`:`<img src="${c.thumb}">`}<span class="tag" style="background:${c.access==='pro'?'#f5a623':'#12b76a'};color:${c.access==='pro'?'#3a2600':'#fff'}">${c.access}</span></div>`).join('');
  }
  catch(e){document.getElementById('tr').innerHTML='<p class="err">'+h(e.message)+'</p>';}
}

let _cat=null,_q='',_cats=[],_sort='trending',_fopen=false;
let _off=0,_more=true,_bz=false;
function _fActive(){return _cat!==null||_sort!=='trending';}
async function vBrowse(){
  view(`<h2 class="sec">Browse clips</h2><p class="subsec">Every ready-to-use template, always fresh</p>
   <div class="fbar">
     <input id="q" placeholder="Search clips, movies…" value="${h(_q)}" onkeydown="if(event.key==='Enter'){_q=this.value;loadBrowse()}">
     <button class="fbtn ${_fActive()?'on':''}" id="fbtn" onclick="toggleFilters()"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2l-7 7v5l-4 2v-7L3 7z"/></svg>Sort & filter${_fActive()?' <span class="dot"></span>':''}</button>
   </div>
   <div id="fpanel" style="display:${_fopen?'block':'none'}"></div>
   <div class="grid" id="gr"></div>
   <div id="more" style="text-align:center;padding:26px 0;color:var(--muted);font-size:13px"></div>`);
  try{if(!_cats.length)_cats=await api('/categories');}catch(e){}
  if(_fopen)renderFilters();
  window.onscroll=()=>{ if(location.hash.startsWith('#/browse') && _more && !_bz && (window.innerHeight+window.scrollY)>=document.body.offsetHeight-800) loadMore(); };
  loadBrowse();
}
function toggleFilters(){_fopen=!_fopen;const p=document.getElementById('fpanel');if(!p)return;p.style.display=_fopen?'block':'none';if(_fopen)renderFilters();document.getElementById('fbtn').classList.toggle('on',_fopen||_fActive());}
function renderFilters(){
  const p=document.getElementById('fpanel');if(!p)return;
  const sorts=[['trending','🔥 Trending'],['newest','🆕 Newest'],['popular','⭐ Popular']];
  const cats=[['All',null]].concat(_cats.map(c=>[c.name,c.slug]));
  p.innerHTML=`<div class="lbl">Sort by</div><div class="chips">${sorts.map(([v,l])=>`<span class="chip ${_sort===v?'on':''}" onclick="_sort='${v}';loadBrowse();renderFilters()">${l}</span>`).join('')}</div>
    <div class="lbl">Category</div><div class="chips" style="margin-bottom:0">${cats.map(([l,s])=>`<span class="chip ${_cat===s?'on':''}" onclick="_cat=${s?`'${s}'`:'null'};loadBrowse();renderFilters()">${h(l)}</span>`).join('')}</div>`;
}
async function loadBrowse(){ // reset + first page (called on category/search/sort change)
  _off=0;_more=true;
  const fb=document.getElementById('fbtn');if(fb)fb.classList.toggle('on',_fopen||_fActive());
  const gr=document.getElementById('gr'); if(gr)gr.innerHTML='';
  await loadMore();
}
async function loadMore(){
  if(_bz||!_more)return; _bz=true;
  const more=document.getElementById('more'); if(more)more.innerHTML='Loading…';
  try{const qs=new URLSearchParams();if(_q)qs.set('q',_q);if(_cat)qs.set('category',_cat);qs.set('sort',_sort);qs.set('limit','30');qs.set('offset',_off);
    const r=await api('/clips?'+qs.toString());const items=r.items||[];
    document.getElementById('gr').insertAdjacentHTML('beforeend',items.map(clipCard).join(''));
    _off+=items.length; if(items.length<30)_more=false;
    if(more)more.innerHTML=_more?'':(_off?`That's all ${_off} clips`:'No results.');
  }catch(e){if(more)more.innerHTML='<span class="err">'+h(e.message)+'</span>';_more=false;}
  finally{_bz=false;}
}

async function clipDetail(slug){
  location.hash='#/browse';
  try{const c=await api('/clips/'+slug);const[a,b]=g(c.id);
    view(`<div style="display:grid;grid-template-columns:220px 1fr;gap:24px;padding-top:10px">
      <div style="aspect-ratio:9/16;border-radius:16px;overflow:hidden;position:relative;background:#000;box-shadow:var(--shadow)">
        ${c.preview?`<video id="dv" src="${c.preview}" autoplay muted loop playsinline poster="${c.thumb||''}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
        <button onclick="var v=document.getElementById('dv');v.muted=!v.muted;this.textContent=v.muted?'🔇':'🔊'" style="position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:22px;padding:8px 13px;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)">🔇</button>`
        :(c.thumb?`<img src="${c.thumb}" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:`<div style="position:absolute;inset:0;background:linear-gradient(150deg,${a},${b})"></div>`)}
      </div>
      <div><h1 style="margin:0 0 8px">${h(c.title)}</h1>
      <p style="margin:0 0 6px"><span class="badge ${c.access==='pro'?'b-pro':'b-free'}" style="position:static;display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:900;text-transform:uppercase">${c.access}</span></p>
      <p class="muted">by ${h(c.editor_name||'creator')} · ${c.downloads} uses</p>
      <p><b>Movie:</b> ${h(c.movie_name||'—')} &nbsp; <b>Genre:</b> ${h(c.genre||'—')} &nbsp; <b>Language:</b> ${h(c.language)} &nbsp; ${dur(c.duration_sec)}</p>
      <p class="muted" style="font-size:12px;text-transform:uppercase;font-weight:800">Customize in the app</p>
      <p>${(c.layers||[]).map(l=>`<span class="chip" style="display:inline-block;margin:2px">${h(l)}</span>`).join('')}</p>
      <button class="btn" onclick="alert('Editing & export happen in the mobile app (on-device).')">📱 Open in app to customize</button>
      </div></div>`);
  }catch(e){view('<p class="err">'+h(e.message)+'</p>');}
}

async function vPricing(){
  view('<h2 class="sec">Simple plans</h2><p class="muted">Crypto only · Binance Pay · manual renewal.</p><div class="cols3" id="pl">Loading…</div>');
  try{const plans=await api('/billing/plans');
    document.getElementById('pl').innerHTML=plans.map((p,i)=>`<div class="plan ${i===plans.length-1?'hot':''}">
      <div style="font-weight:800;font-size:16px">${h(p.name)}</div>
      <div class="p">$${p.price_usd}<span class="muted" style="font-size:13px">/mo</span></div>
      <ul><li>${p.export_limit==null?'Unlimited exports':p.export_limit+' exports/mo'}</li><li>${h(p.quality)} · ${p.max_devices} devices</li>${(p.features||[]).map(f=>'<li>'+h(f)+'</li>').join('')}</ul>
      ${p.price_usd>0?`<button class="btn" style="width:100%" onclick="subscribe('${p.id}')">Subscribe</button>`:'<div class="muted">Free</div>'}</div>`).join('')||'<p class="muted">No plans.</p>';
  }catch(e){document.getElementById('pl').innerHTML='<p class="err">'+h(e.message)+'</p>';}
}
async function subscribe(planId){
  if(!TOKEN){alert('Please log in first');return go('login');}
  try{const o=await api('/billing/checkout','POST',{plan_id:planId});
    view(`<div class="center-box card" style="text-align:center"><h2>Pay ${o.amount} ${o.currency}</h2>
      <p class="muted">Binance Pay · USDT · BEP20</p><div class="qr" style="margin:10px auto"></div>
      <p style="font-size:12px;word-break:break-all">${h(o.qr_content||o.checkout_url)}</p>
      <p class="muted" style="font-size:13px">Pay in the Binance app — your plan unlocks automatically once confirmed. No need to refresh.</p>
      <button class="btn" onclick="go('account')">Go to account</button></div>`);
  }catch(e){alert(e.message);}
}

async function vLogin(){
  view(`<div class="center-box card"><h2 style="text-align:center">Welcome back</h2>
   <input id="e" placeholder="Email" type="email"><input id="p" placeholder="Password" type="password">
   <button class="btn" style="width:100%" onclick="doAuth('login')">Log in</button>
   <div class="err" id="ae" style="margin-top:8px"></div>
   <p class="muted" style="text-align:center;margin-top:12px">New here? <a class="link" style="color:var(--ink)" onclick="go('register')">Create account</a></p></div>`);
}
async function vRegister(){
  view(`<div class="center-box card"><h2 style="text-align:center">Create account</h2>
   <input id="n" placeholder="Name"><input id="e" placeholder="Email" type="email"><input id="p" placeholder="Password (min 8)" type="password">
   <button class="btn" style="width:100%" onclick="doAuth('register')">Create account</button>
   <div class="err" id="ae" style="margin-top:8px"></div>
   <p class="muted" style="text-align:center;margin-top:12px">Have an account? <a class="link" style="color:var(--ink)" onclick="go('login')">Log in</a></p></div>`);
}
async function doAuth(kind){
  const email=document.getElementById('e').value,password=document.getElementById('p').value;
  const body=kind==='register'?{name:document.getElementById('n').value,email,password}:{email,password};
  try{const r=await api('/auth/'+kind,'POST',body);TOKEN=r.tokens.access_token;localStorage.setItem('cc_web',TOKEN);ME=r.user;renderNav();go('account');}
  catch(e){document.getElementById('ae').textContent=e.message;}
}

let _acctab='sub';
async function vAccount(){
  if(!TOKEN)return go('login');
  view(`<h2 class="sec">Hi, ${h(ME?.name||'')}</h2>
   <div class="tabs"><span class="chip ${_acctab==='sub'?'on':''}" onclick="_acctab='sub';vAccount()">Subscription</span>
   <span class="chip ${_acctab==='pay'?'on':''}" onclick="_acctab='pay';vAccount()">Payments</span>
   <span class="chip ${_acctab==='dev'?'on':''}" onclick="_acctab='dev';vAccount()">Devices</span></div>
   <div id="ac">Loading…</div>`);
  try{
    if(_acctab==='sub'){const s=await api('/billing/subscription');
      document.getElementById('ac').innerHTML=s?`<div class="card"><b style="font-size:17px">${h(s.plan_name)}</b> <span class="pill p-ok">${h(s.status)}</span>
        <p class="muted">Expires ${h((s.expires_at||'').split('T')[0])} · manual renewal</p>
        <button class="btn sm" onclick="go('pricing')">Renew / change</button></div>`
        :`<div class="card"><p class="muted">No active subscription.</p><button class="btn sm" onclick="go('pricing')">See plans</button></div>`;
    } else if(_acctab==='pay'){const ps=await api('/billing/payments');
      document.getElementById('ac').innerHTML='<div class="card"><table><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th></tr>'+
        (ps.map(p=>`<tr><td>${h((p.created_at||'').split('T')[0])}</td><td>${h(p.plan_name)}</td><td>${p.amount} ${h(p.currency)}</td><td><span class="pill p-ok">${h(p.status)}</span></td></tr>`).join('')||'<tr><td colspan=4 class="muted">No payments</td></tr>')+'</table></div>';
    } else {const ds=await api('/auth/devices');
      document.getElementById('ac').innerHTML='<div class="card">'+(ds.map(d=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><b>${h(d.os||'Device')}</b><span class="muted" style="flex:1">${h(d.country||'')} · ${h((d.last_active||'').split('T')[0])}</span><button class="btn sm sec" onclick="rmDev('${d.id}')">Remove</button></div>`).join('')||'<p class="muted">No devices</p>')+'</div>';
    }
  }catch(e){document.getElementById('ac').innerHTML='<p class="err">'+h(e.message)+'</p>';}
}
async function rmDev(id){try{await api('/auth/devices/'+id,'DELETE');vAccount();}catch(e){alert(e.message);}}

window.addEventListener('hashchange',()=>{const v=location.hash.slice(2);if(v&&v!=='browse')return;});
boot();
</script>
</body>
</html>
